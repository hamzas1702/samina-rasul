name: Deploy to Hostinger (Staging)

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging # Requires GitHub branch protection/environment setup

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint PHP
        run: |
          # The cheapest possible gate between a push and a live store: nothing
          # with a parse error can reach the atomic swap. Only the two trees the
          # deploy actually ships are linted.
          find ./site/wp-content/themes/samina-rasul \
               ./site/wp-content/mu-plugins/samina-core \
               ./site/wp-content/mu-plugins/samina-core.php \
               -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Inject Build SHA into Theme
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          sed -i "s/{{GITHUB_SHA}}/$GITHUB_SHA/g" ./site/wp-content/themes/samina-rasul/footer.php
          echo "Verifying marker injection in footer.php..."
          tail -n 5 ./site/wp-content/themes/samina-rasul/footer.php

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Prepare Remote Directories
        env:
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          SSH_CMD="ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -p $SSH_PORT $SSH_USER@$SSH_HOST"
          $SSH_CMD "mkdir -p $REMOTE_PATH/wp-content/themes/samina-rasul-backups $REMOTE_PATH/wp-content/mu-plugins/samina-core-backups"

      - name: Sync Theme to Temp Dir
        env:
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -avz --delete \
          --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
          --exclude-from="./.rsync-exclude" \
          -e "ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -p $SSH_PORT" \
          ./site/wp-content/themes/samina-rasul/ \
          $SSH_USER@$SSH_HOST:$REMOTE_PATH/wp-content/themes/samina-rasul-_deploy/

      - name: Sync MU-Plugin to Temp Dir
        env:
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -avz --delete \
          --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
          --exclude-from="./.rsync-exclude" \
          -e "ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -p $SSH_PORT" \
          ./site/wp-content/mu-plugins/samina-core/ \
          $SSH_USER@$SSH_HOST:$REMOTE_PATH/wp-content/mu-plugins/samina-core-_deploy/

      - name: Sync MU-Plugin Loader
        env:
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # samina-core.php is the file WordPress actually auto-loads; everything
          # under samina-core/ is dead code without it. It used to be excluded
          # from the deploy entirely, so live depended on a copy someone had
          # placed by hand once, with nothing verifying it was still there - and
          # if it vanished, bridal prices would go public and bridal products
          # purchasable, silently, with a passing health check.
          #
          # Copied in place rather than through the atomic swap: it is a single
          # idempotent file that only globs whatever is in samina-core/ at the
          # time, so it is correct before or after the directory swap.
          rsync -avz \
          --chmod=Fu=rw,Fgo=r \
          -e "ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -p $SSH_PORT" \
          ./site/wp-content/mu-plugins/samina-core.php \
          $SSH_USER@$SSH_HOST:$REMOTE_PATH/wp-content/mu-plugins/samina-core.php

      - name: Execute Zero-Gap Atomic Swap & Safe Rotation
        env:
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          SSH_CMD="ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -p $SSH_PORT $SSH_USER@$SSH_HOST"
          $SSH_CMD "REMOTE_PATH='$REMOTE_PATH' bash -s" <<'EOF'
            set -e
            TS=$(date +%s)
            THEME_DIR="$REMOTE_PATH/wp-content/themes/samina-rasul"
            MU_DIR="$REMOTE_PATH/wp-content/mu-plugins/samina-core"

            # The swap itself must be all-or-nothing, so set -e stays on for it.
            if [ ! -d "$THEME_DIR-_deploy" ]; then
              echo "FAIL: $THEME_DIR-_deploy is missing - the theme rsync did not land."
              exit 1
            fi
            if [ ! -d "$MU_DIR-_deploy" ]; then
              echo "FAIL: $MU_DIR-_deploy is missing - the mu-plugin rsync did not land."
              exit 1
            fi

            mkdir -p "$THEME_DIR-backups" "$MU_DIR-backups"

            # Zero-gap swap
            if [ -d "$THEME_DIR" ]; then mv "$THEME_DIR" "${THEME_DIR}-tmp-old"; fi
            mv "$THEME_DIR-_deploy" "$THEME_DIR"
            if [ -d "${THEME_DIR}-tmp-old" ]; then mv "${THEME_DIR}-tmp-old" "$THEME_DIR-backups/samina-rasul-$TS"; fi

            if [ -d "$MU_DIR" ]; then mv "$MU_DIR" "${MU_DIR}-tmp-old"; fi
            mv "$MU_DIR-_deploy" "$MU_DIR"
            if [ -d "${MU_DIR}-tmp-old" ]; then mv "${MU_DIR}-tmp-old" "$MU_DIR-backups/samina-core-$TS"; fi

            echo "Swap complete."

            # ---------------------------------------------------------------
            # Backup rotation. Housekeeping, and from here nothing may fail the
            # deploy: the new code is already live, so aborting now reports a
            # failure for a release that actually succeeded and sends a healthy
            # site into rollback.
            #
            # This is what broke the first deploy to a fresh server. The old
            # rotation read:
            #
            #   THEME_BACKUPS=$(ls -1dt "$THEME_DIR-backups"/samina-rasul-* 2>/dev/null)
            #
            # With no backups yet the glob does not expand, ls exits 2, and
            # 2>/dev/null silences the message but not the status. An assignment
            # carries its command substitution's exit status, so set -e killed
            # the step with exit 2 - after a swap that had gone perfectly.
            # ---------------------------------------------------------------
            set +e

            prune_backups() {
              dir="$1"
              prefix="$2"
              keep=3

              [ -d "$dir" ] || return 0

              # || true is the fix: an empty directory is a normal state, not an
              # error. Newest first, keep $keep, delete the rest.
              backups=$(ls -1dt "$dir/$prefix-"* 2>/dev/null || true)
              [ -n "$backups" ] || return 0

              printf '%s\n' "$backups" | tail -n +$((keep + 1)) | xargs -r rm -rf
              return 0
            }

            prune_backups "$THEME_DIR-backups" "samina-rasul"
            prune_backups "$MU_DIR-backups" "samina-core"

            echo "Backups on disk:"
            ls -1dt "$THEME_DIR-backups"/samina-rasul-* 2>/dev/null || echo "  none yet (first deploy)"

            exit 0
          EOF

      - name: Flush Cache & Reset OPcache (Forward Path)
        env:
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          LIVE_URL: ${{ secrets.LIVE_URL }}
          SR_OPCACHE_SECRET: ${{ secrets.SR_OPCACHE_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        # Best effort throughout - see remote-flush.sh for why this never fails
        # the deploy. The gate is the health check that follows.
        shell: bash {0}
        run: |
          LIVE_URL="${LIVE_URL%/}"
          SSH_CMD="ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -p $SSH_PORT $SSH_USER@$SSH_HOST"

          # The shared library is piped in ahead of the step script rather than
          # uploaded: one copy of "where is WordPress" and "how do I reach it",
          # and nothing left behind on the host.
          cat ./.github/scripts/remote-lib.sh ./.github/scripts/remote-flush.sh \
            | $SSH_CMD "REMOTE_PATH='$REMOTE_PATH' LIVE_URL='$LIVE_URL' SR_OPCACHE_SECRET='$SR_OPCACHE_SECRET' bash -s"

          exit 0

      - name: Health Check (Forward Path)
        id: health_check
        env:
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          LIVE_URL: ${{ secrets.LIVE_URL }}
          GITHUB_SHA: ${{ github.sha }}
          # Optional. Repository variable, e.g. "/product/some-live-product/".
          HEALTH_CHECK_PRODUCT_PATH: ${{ vars.HEALTH_CHECK_PRODUCT_PATH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        shell: bash {0}
        run: |
          LIVE_URL="${LIVE_URL%/}"
          SSH_CMD="ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -p $SSH_PORT $SSH_USER@$SSH_HOST"

          # The gate: run on the server, over the loopback. Checking from the
          # runner does not work on this host - every request is reset before a
          # response arrives, whether the site is healthy or not.
          cat ./.github/scripts/remote-lib.sh ./.github/scripts/remote-health.sh \
            | $SSH_CMD "REMOTE_PATH='$REMOTE_PATH' LIVE_URL='$LIVE_URL' GITHUB_SHA='$GITHUB_SHA' HEALTH_CHECK_PRODUCT_PATH='$HEALTH_CHECK_PRODUCT_PATH' bash -s"
          GATE=$?

          if [ "$GATE" -ne 0 ]; then
            echo "FAIL: the release did not verify on the server."
            exit 1
          fi

          # ---------------------------------------------------------------
          # Public reachability, informational only.
          #
          # Two different questions: "is the new code being served" (answered
          # above, authoritatively) and "can the outside world load the site"
          # (below). The second cannot fail the deploy, because a negative
          # answer from a GitHub runner does not distinguish a site that is down
          # from a host that refuses datacenter IPs.
          # ---------------------------------------------------------------
          source ./.github/scripts/deploy-http.sh

          echo ""
          echo "Checking the public URL ($LIVE_URL)..."
          PUBLIC_STATUS=$(sr_http_retry 2 /tmp/public_body.txt "$LIVE_URL/?sr_qa=$GITHUB_SHA")

          if [ "$PUBLIC_STATUS" = "200" ] && grep -q "sr_build_marker: $GITHUB_SHA" /tmp/public_body.txt; then
            echo "Public URL serves this release."
          elif [ "$PUBLIC_STATUS" = "200" ]; then
            echo "NOTE: the public URL responds, but without this commit's build marker."
            echo "      Something in front of the site is serving cached HTML."
          else
            echo "NOTE: the public URL returned $PUBLIC_STATUS from this runner."
            echo "      The release is verified on the server, so this is about reachability, not the code."
            echo "      Most common cause: the LIVE_URL secret points at a hostname the server no longer"
            echo "      serves - an old *.hostingersite.com preview domain, for example, after a real"
            echo "      domain has been attached. Compare it with the site URL reported above."
          fi

          exit 0

      - name: Auto-Rollback on Failure
        id: rollback
        if: failure()
        env:
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          LIVE_URL: ${{ secrets.LIVE_URL }}
          SR_OPCACHE_SECRET: ${{ secrets.SR_OPCACHE_SECRET }}
          GITHUB_SHA: ${{ github.sha }}
          HEALTH_CHECK_PRODUCT_PATH: ${{ vars.HEALTH_CHECK_PRODUCT_PATH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        # No `-e`: this step is the safety net. If it dies partway it never
        # writes ROLLBACK_STATUS, and the notification then reports "pre-swap,
        # code did not reach production" about a site that is mid-rollback - the
        # most dangerous wrong thing this pipeline can say.
        shell: bash {0}
        run: |
          LIVE_URL="${LIVE_URL%/}"
          SSH_CMD="ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -p $SSH_PORT $SSH_USER@$SSH_HOST"

          cat ./.github/scripts/remote-lib.sh ./.github/scripts/remote-rollback.sh \
            | $SSH_CMD "REMOTE_PATH='$REMOTE_PATH' LIVE_URL='$LIVE_URL' SR_OPCACHE_SECRET='$SR_OPCACHE_SECRET' GITHUB_SHA='$GITHUB_SHA' HEALTH_CHECK_PRODUCT_PATH='$HEALTH_CHECK_PRODUCT_PATH' bash -s"

          case $? in
            0)  ROLLBACK_STATUS="SUCCESS" ;;
            10) ROLLBACK_STATUS="NO_BACKUP" ;;
            *)  ROLLBACK_STATUS="FAILED" ;;
          esac

          echo "Rollback status: $ROLLBACK_STATUS"
          echo "ROLLBACK_STATUS=$ROLLBACK_STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Notify on Failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ROLLBACK_STATUS: ${{ steps.rollback.outputs.ROLLBACK_STATUS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash {0}
        run: |
          case "${ROLLBACK_STATUS:-UNKNOWN}" in
            SUCCESS)
              MSG="🚨 **Deployment failed** on staging. Auto-rollback ran and was verified on every checked page. The site is serving the previous release." ;;
            NO_BACKUP)
              MSG="🚨 **Deployment failed** on staging, and there was no previous release to roll back to (first deploy). Whatever is on disk is what is being served - check the site." ;;
            FAILED)
              MSG="🚨🚨 **CRITICAL: deployment failed AND rollback failed.** Manual intervention required. The site may be down." ;;
            *)
              MSG="🚨 **Deployment failed** before the swap. The code did not reach production." ;;
          esac

          echo "$MSG"

          # The notifier must never be the thing that fails the run: the useful
          # information is already in the log above. An unset webhook secret made
          # curl exit 2 with "no URL specified" and turned every genuine failure
          # into two confusing ones.
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "DISCORD_WEBHOOK is not set - skipping the notification."
            exit 0
          fi

          # jq builds the JSON so a quote or newline in the message cannot break
          # the payload.
          PAYLOAD=$(jq -nc --arg content "$MSG See: $RUN_URL" '{content: $content}')

          curl -sS -m 15 \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK" \
            || echo "WARNING: could not reach the Discord webhook."

          exit 0
